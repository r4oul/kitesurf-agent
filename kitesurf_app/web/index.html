<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Developed by Kitesurfers for Kitesurfers. Live wind, tide and sewage forecasts for 27 beaches across the South West.">

  <!-- Open Graph — controls WhatsApp, iMessage, Facebook link previews -->
  <meta property="og:title" content="South West Kitesurf — Live Forecast &amp; Beach Guide">
  <meta property="og:description" content="Developed by Kitesurfers for Kitesurfers. Live wind, tide and sewage forecasts for 27 beaches across the South West.">
  <meta property="og:image" content="https://southwestkitesurf.co.uk/icons/Icon-512.png">
  <meta property="og:url" content="https://southwestkitesurf.co.uk">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SW Kitesurf">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>South West Kitesurf — Live Forecast &amp; Beach Guide</title>
  <link rel="manifest" href="manifest.json">
  <!-- Warm up connections before Flutter boots -->
  <link rel="preconnect" href="https://web-production-7cfa1.up.railway.app">
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="dns-prefetch" href="https://marine-api.open-meteo.com">
  <style>
    #loading-splash {
      position: fixed; inset: 0;
      background: #0D1B2A;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #B0BEC5;
    }
    #loading-splash svg { margin-bottom: 1.2rem; }
    #loading-splash .title { color: #00D4FF; font-size: 1.2rem; font-weight: 700; margin-bottom: 0.3rem; }
    #loading-splash .sub { font-size: 0.8rem; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <div id="loading-splash">
    <svg viewBox="0 0 100 100" width="56" height="56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10,55 C0,10 100,10 90,55 C85,75 15,75 10,55Z" fill="rgba(0,212,255,0.3)"/>
      <path d="M10,55 C0,10 100,10 90,55 C85,75 15,75 10,55Z" stroke="#00D4FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <line x1="50" y1="20" x2="50" y2="72" stroke="#00D4FF" stroke-width="6" stroke-linecap="round"/>
      <line x1="10" y1="55" x2="35" y2="95" stroke="#00D4FF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <line x1="90" y1="55" x2="65" y2="95" stroke="#00D4FF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <line x1="25" y1="95" x2="75" y2="95" stroke="#00D4FF" stroke-width="8" stroke-linecap="round"/>
    </svg>
    <div class="title">South West Kitesurf</div>
    <div class="sub">Loading forecast…</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
